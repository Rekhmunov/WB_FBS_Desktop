<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>ТСД · ВБ ФБС</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/wb_fbs_tsd.css?v=22" />
</head>
<body class="tsd-body">
  <div id="tsdApp" class="tsd-app">
    <header class="tsd-top">
      <div class="tsd-top-row">
        <a class="tsd-back" id="tsdBackBtn" href="/app" hidden>←</a>
        <div class="tsd-top-title" id="tsdTitle">ТСД</div>
        <button type="button" class="tsd-icon-btn" id="tsdSearchBtn" hidden
          aria-label="Поиск" title="Поиск">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/>
            <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="tsd-filter-wrap" id="tsdFilterWrap" hidden>
          <button type="button" class="tsd-icon-btn" id="tsdFilterBtn"
            aria-label="Фильтры заказов" title="Фильтры" aria-haspopup="true" aria-expanded="false">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="tsd-filter-menu" id="tsdFilterMenu" hidden role="menu">
            <label class="tsd-filter-item" id="tsdFilterFilledLabel">
              <input type="checkbox" id="tsdFilterFilled" />
              <span>Заполненные</span>
            </label>
            <label class="tsd-filter-item" id="tsdFilterEmptyLabel">
              <input type="checkbox" id="tsdFilterEmpty" />
              <span>Незаполненные</span>
            </label>
            <label class="tsd-filter-item" id="tsdFilterErrorsLabel" hidden>
              <input type="checkbox" id="tsdFilterErrors" />
              <span>С ошибками</span>
            </label>
            <label class="tsd-filter-item" id="tsdFilterCancelledLabel">
              <input type="checkbox" id="tsdFilterCancelled" />
              <span>Отмененные</span>
            </label>
          </div>
        </div>
        <button type="button" class="tsd-icon-btn tsd-close-btn" id="tsdCloseBtn" hidden
          aria-label="Закрыть" title="Закрыть">×</button>
        <select id="tsdSourceSelect" class="tsd-source" title="Кабинет"></select>
      </div>
      <div class="tsd-search-panel" id="tsdSearchPanel" hidden>
        <input class="tsd-search-input" id="tsdOrderSearch" type="search"
          placeholder="Стикер, заказ, ШК, артикул, название…"
          autocomplete="off" enterkeyhint="search" />
        <button type="button" class="tsd-icon-btn tsd-search-close" id="tsdSearchClose"
          aria-label="Закрыть поиск" title="Закрыть">×</button>
      </div>
      <div class="tsd-progress" id="tsdProgressBar" hidden>
        <div class="tsd-progress-fill" id="tsdProgressFill"></div>
      </div>
    </header>

    <main class="tsd-main" id="tsdMain">
      <div class="tsd-loading">Загрузка…</div>
    </main>

    <button type="button" class="tsd-scroll-top" id="tsdScrollTop" hidden
      aria-label="К полю сканирования" title="Наверх">↑</button>

    <div class="tsd-toast" id="tsdToast" hidden role="status"></div>
  </div>

  <script>
    window.TSD_BOOT = {
      can_view_wb_fbs_tsd: {{CAN_VIEW_WB_FBS_TSD}},
      is_tenant_owner: {{IS_TENANT_OWNER}},
      email: "{{SAFE_EMAIL}}"
    };
  </script>
  <script src="/static/wb_fbs_tsd.js?v=33"></script>
</body>
</html>
